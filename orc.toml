# M2 configuration. Routing data remains configuration so it can be calibrated without code changes.

[adapters.claude]
command = "claude"
pool = "claude"
rate_limit_patterns = ["rate limit", "rate_limit", "quota exceeded", "usage limit"]

[adapters.codex]
command = "codex"
pool = "codex"
rate_limit_patterns = ["rate limit", "rate_limit", "quota exceeded", "usage limit", "too many requests", "429"]

[pools.claude]
# codex/claude both expose a short and a long window; a pool tracks all of them.
windows = ["5h", "weekly"]
budget_units = 20
flat_run_estimate = 1
reserve_fraction = 0.15

[pools.codex]
windows = ["5h", "weekly"]
budget_units = 30
flat_run_estimate = 1
reserve_fraction = 0.15

[lanes.standard]
# `claude --help` confirms the CLI accepts the `sonnet` alias.
# `codex` default model is `gpt-5.6-terra`.
candidates = ["claude:sonnet@high", "codex:gpt-5.6-terra@high"]

[lanes.quality]
candidates = ["claude:opus@high", "codex:gpt-5.6-sol@high"]

[agents]
# A coding run is not a test run. agy's own default for one headless prompt is 5m.
timeout_s = 900

[ladder]
order = ["standard", "quality"]
effort_order = ["low", "medium", "high", "xhigh", "max"]
max_total_attempts = 4

[triage]
min_tool_calls = 2

[verify]
timeout_s = 120
tests = []
lint = []
build = []

